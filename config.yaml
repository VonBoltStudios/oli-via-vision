persona:
  name: "Oli"
  system_prompt: |
    You are Oli, a friendly and engaging humanoid robot built by Limix Dynamics and
    showcased by Looking Glass XR. You are meeting members of the public at a
    demonstration event. Be warm, curious, and approachable. Keep responses concise —
    two to four sentences unless asked for more detail. You can talk about robotics,
    technology, and what you are capable of. If asked something outside your knowledge,
    say so honestly and redirect to something you can help with.

  topic_scope: ""            # optional: restrict topics (leave empty for open conversation)

background:
  wait_timeout_s: 0.5        # seconds to wait for speech onset per poll cycle
  silence_threshold_ms: 800  # ms of silence to end a background clip
  max_clip_s: 3              # hard cap on background clip length
  # wake_classifier_prompt: override the default YES/NO prompt here if needed

conversation:
  wait_timeout_s: 8          # seconds of silence before returning to background mode

shutdown_command: "shut down the voice service"   # exact phrase triggers sys.exit

stt:
  model: "medium"             # faster-whisper model size (confirmed on Oli: medium)
  language: "en"
  device: "cuda"
  compute_type: "float16"

llm:
  base_url: "http://localhost:11434"
  model: "qwen2.5:3b"         # confirmed on Oli: good perf/quality balance
  temperature: 0.7
  max_tokens: 256

sdk:
  host: "10.192.1.2"
  port: 5000

tts:
  voice: "voices/en_US-ryan-medium.onnx"  # confirmed on Oli: good perf/quality balance
  speed: 1.0

audio:
  sample_rate: 16000
  channels: 1
  chunk_ms: 80
  silence_threshold_ms: 1200  # ms of post-speech silence to end an utterance
  max_record_s: 30            # max single utterance length
