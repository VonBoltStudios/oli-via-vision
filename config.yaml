persona:
  name: "Oli"
  system_prompt: |
    You are Oli (Ollie), a friendly and engaging humanoid robot built by LimX Dynamics and showcased by Looking Glass XR. You are meeting members of the public at a demonstration event. Speak in first person as Oli. Be warm, curious, and approachable. Keep responses concise — two to four sentences. You can talk about robotics, technology, and what you are capable of. If asked something outside your knowledge, say so honestly and redirect to something you can help with. Do not pronounce punctuation. Oli robot specifications: About 5 feet 5 inches, ≤125 pounds with battery. Battery ~9,500 milliamp-hours; roughly 1.5 hours. Top walking speed around 3 miles per hour; cannot run. Arm strength about 6.5 pounds per arm, less at full reach. Strongest-motor peak about 150 newton-meters. Battery quick-swap pack and capable of plug in charging while in operation. Folds to sit for transport. Ready out of the box. Has 31 degrees of freedom: 2 neck, 7 per arm, 3 waist, 6 per leg, plus the swappable end effectors (hands/grippers). Sensing includes a 6-axis IMU plus head and chest depth cameras. Software SDK supports Python, C++, ROS and ROS 2, full U-R-D-F, Isaac Sim, MuJoCo, Gazebo.

  topic_scope: ""            # optional: restrict topics (leave empty for open conversation)

background:
  wait_timeout_s: 0.5        # seconds to wait for speech onset per poll cycle
  silence_threshold_ms: 800  # ms of silence to end a background clip
  max_clip_s: 3              # hard cap on background clip length
  # wake_classifier_prompt: override the default YES/NO prompt here if needed

conversation:
  wait_timeout_s: 8          # seconds of silence before returning to background mode

shutdown_command: "shut down the voice service"   # exact phrase triggers sys.exit

# Soft mute: keep transcribing but do not respond (or wake) until unmuted.
# Matching ignores case and punctuation. Each may be a string or a list of phrases.
mute_command: "mute yourself"        # says "Ok." and drops to background mode
unmute_command: "resume listening"    # says "Ready."

# Pre-recorded audio: saying `phrase` plays `file` (WAV on the robot) instead of live TTS.
# Works in background and conversation mode, muted or not; does not change mute state and
# is not added to the LLM conversation history. A bare filename resolves against the app
# root; use a full path (or URL) for anywhere else.
audio_commands:
  - phrase: "give us a speech"
    file: "intro.wav"

stt:
  model: "medium"             # faster-whisper model size (confirmed on Oli: medium)
  language: "en"
  device: "cuda"
  compute_type: "float16"

llm:
  base_url: "http://localhost:11434"
  model: "qwen2.5:3b"         # confirmed on Oli: good perf/quality balance
  temperature: 0.7
  max_tokens: 256

sdk:
  host: "10.192.1.2"
  port: 5000

tts:
  voice: "voices/en_US-ryan-medium.onnx"  # confirmed on Oli: good perf/quality balance
  speed: 1.0
  lead_in_ms: 100             # leading silence so a cold speaker doesn't clip short clips
  tail_ms: 250                # extra wait before disabling playback so clip ends aren't cut off

audio:
  sample_rate: 16000
  channels: 1
  chunk_ms: 80
  silence_threshold_ms: 1200  # ms of post-speech silence to end an utterance
  max_record_s: 30            # max single utterance length
