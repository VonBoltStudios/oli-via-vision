# Mac local test config — CPU inference, local models already pulled
wake_word:
  phrase: "hey_mycroft"      # using built-in model for local test; swap to custom "hey oli" model on Orin
  threshold: 0.5

persona:
  name: "Oli"
  system_prompt: |
    You are Oli, a friendly humanoid robot. Keep responses brief — two sentences max.
    You are being tested on a developer's Mac before deployment to your actual hardware.
  topic_scope: ""

stt:
  model: "base"              # smaller model for CPU test (faster)
  language: "en"
  device: "cpu"
  compute_type: "int8"

llm:
  base_url: "http://localhost:11434"
  model: "qwen2.5:3b"        # already pulled locally
  temperature: 0.7
  max_tokens: 128

tts:
  voice: "/Users/vanessa/.local/share/piper/voices/en_US-lessac-medium.onnx"
  piper_bin: "/Users/vanessa/.local/share/piper/piper"
  speed: 1.0
  output_device: null

push_to_talk: true       # skip wake word for local testing; set to false for wake word mode

audio:
  sample_rate: 16000
  channels: 1
  chunk_ms: 80
  silence_threshold_ms: 1200
  max_record_s: 30
